[project]
name = "ml-project-01"
version = "0.1.0"
description = "House price prediction on the Kaggle Ames dataset: data cleaning, EDA and regularised linear regression (OLS, Ridge, Lasso)"
readme = "README.md"
authors = [
    { name = "Zarah Dominguez" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
