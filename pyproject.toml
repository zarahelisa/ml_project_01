[project]
name = "ml-project-01"
version = "0.1.0"
description = "House price prediction on the Kaggle Ames dataset: data cleaning, EDA and regularised linear regression (OLS, Ridge, Lasso)"
readme = "README.md"
authors = [
    { name = "zarahelisa", email = "zarah.dominguez@thinkanova.org" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
ml-project-01 = "ml_project_01:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
